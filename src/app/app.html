<div class="shell">
  <header class="shell__header">
    <a class="brand" routerLink="/" data-qt-id="appRoot_header_homeLink">
      <span class="brand__accent">tasks</span><span>.store</span>
    </a>

    <button
      type="button"
      class="switch"
      role="switch"
      [attr.aria-checked]="preferences.theme() === 'dark'"
      (click)="onToggleTheme()"
      data-qt-id="appRoot_header_themeToggleButton">
      <span class="switch__track"><span class="switch__knob"></span></span>
      <span class="switch__label">{{ preferences.theme() === 'dark' ? 'Sombre' : 'Clair' }}</span>
    </button>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
